version: '3.8'

services:
  # ========================================================
  # RecallAI Unified Main Web Service (Single-Port: 8000)
  # Serves React Frontend SPA, REST API, WebSockets & Docs
  # ========================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recallai_main_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./database/recallai.db
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
